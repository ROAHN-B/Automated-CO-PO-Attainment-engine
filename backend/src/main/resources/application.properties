spring.application.name=attainment-engine
server.port=8081
spring.mongodb.uri=${MONGODB_URI}

# Sign-in tokens (JWT_SECRET: at least 32 characters) and the Angular dev server
spring.mongodb.auto-index-creation=true
app.jwt.secret=${JWT_SECRET:}
app.jwt.ttl=PT8H
# Mayuri's academic AI service (CAM suggestions, question paper validation)
app.ai.base-url=${AI_SERVICE_URL:http://localhost:8000}
app.ai.internal-token=${AI_INTERNAL_TOKEN:}
# Demo data for the POE (accounts, the Network Security course); on in the dev profile
app.seed.enabled=false
